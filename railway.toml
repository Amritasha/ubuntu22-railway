[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
startCommand = "/bin/bash -c 'exec /bin/ttyd -p \"$PORT\" -c \"$USERNAME:$PASSWORD\" /bin/bash'"
numReplicas = 1

# No [deploy.resources] cap: this is a developer shell with build-essential and
# gcc installed, and a 256MB ceiling made anything beyond a trivial compile die.

[[volumes]]
mountPath = "/root"
name = "ubuntu22-data"
